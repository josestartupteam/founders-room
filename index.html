<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a1d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="חדר המייסדים">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>חדר המייסדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: airy single column on a warm paper ground; floating white cards, pill navigation; each screen = one stage of the idea funnel */
  --bg:#f6f4ef;
  --bg-2:#efece5;
  --surface:#ffffff;
  --ink:#1f2a30;
  --muted:#6c7a80;
  --line:#e8e4dc;
  --accent:#2f7a6b;
  --accent-ink:#ffffff;
  --accent-soft:#e3f1ec;
  --sky-soft:#e6eef7;
  --warn:#9a6420;
  --warn-soft:#fbefdc;
  --bad:#b24b4b;
  --bad-soft:#f9e6e4;
  --violet-soft:#eeeafa;
  --shadow:0 1px 2px rgba(40,35,25,.04),0 6px 22px rgba(40,35,25,.06);
  --shadow-lift:0 2px 4px rgba(40,35,25,.05),0 14px 34px rgba(40,35,25,.09);
  --radius:16px;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a1d; --bg-2:#1a2125; --surface:#1d262b; --ink:#e7ecea; --muted:#9aa7a9; --line:#2b363c;
    --accent:#6cc4ae; --accent-ink:#0e1a17; --accent-soft:#1d3530; --sky-soft:#1d2a38;
    --warn:#e6b072; --warn-soft:#3a2e1d; --bad:#ec9a95; --bad-soft:#3a2424; --violet-soft:#29243c;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.25);
    --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a1d; --bg-2:#1a2125; --surface:#1d262b; --ink:#e7ecea; --muted:#9aa7a9; --line:#2b363c;
  --accent:#6cc4ae; --accent-ink:#0e1a17; --accent-soft:#1d3530; --sky-soft:#1d2a38;
  --warn:#e6b072; --warn-soft:#3a2e1d; --bad:#ec9a95; --bad-soft:#3a2424; --violet-soft:#29243c;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.25);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:1.75rem}
h2{font-size:1.15rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand b{font-family:var(--display);font-weight:500;font-size:1.05rem;display:block}
.brand .sub{color:var(--muted);font-size:.78rem}
.mark{flex:none;width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#6aa7c9));display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:1rem;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600}
.side-nav a:hover{background:var(--bg);color:var(--ink)}
.side-nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.side-nav a[aria-current="page"] .ic{color:var(--accent)}
.side-nav .n{margin-inline-start:auto;font-size:.75rem;background:var(--bg-2);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.side-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;background:transparent;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;text-align:start}
.side-btn:hover{background:var(--bg);color:var(--ink)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.content{min-width:0}
.topbar{display:none}
.bottom-nav,.fab{display:none}
main{max-width:1000px;margin:0 auto;padding:30px 32px 60px;display:flex;flex-direction:column;gap:22px}
.signed-out{grid-template-columns:1fr}
.signed-out .side,.signed-out .topbar,.signed-out .bottom-nav,.signed-out .fab{display:none!important}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:6;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .topbar .mark{width:30px;height:30px;font-size:.9rem;border-radius:10px}
  .topbar b{font-family:var(--display);font-weight:500;font-size:1.08rem}
  .top-actions{display:flex;gap:8px}
  .round-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .round-btn .ic{width:18px;height:18px}
  .avatar{font-weight:700;color:var(--accent);font-family:var(--display)}
  main{padding:8px 16px calc(110px + env(safe-area-inset-bottom));gap:18px}
  .view-head h1{font-size:1.45rem}
  .view-head .actions .btn.primary{display:none}
  .bottom-nav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;bottom:0;inset-inline:0;z-index:7;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line)}
  .bottom-nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:600;border-radius:12px}
  .bottom-nav a .ic{width:22px;height:22px}
  .bottom-nav a[aria-current="page"]{color:var(--accent)}
  .bottom-nav a[aria-current="page"] .ic{stroke-width:2.2}
  .bottom-nav .dot{position:absolute;top:4px;inset-inline-end:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .fab{display:grid;place-items:center;position:fixed;z-index:8;inset-inline-end:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
  .fab .ic{width:26px;height:26px;stroke-width:2.2}
  #modal{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
}
.banner{border-radius:12px;padding:12px 16px;background:var(--warn-soft);color:var(--ink)}
.view-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.view-head .lead{color:var(--muted);max-width:60ch;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--surface);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.list{display:flex;flex-direction:column;gap:12px}
.section-title{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--bg-2);color:var(--ink)}
.chip.accent{background:var(--accent-soft)}
.chip.sky{background:var(--sky-soft)}
.chip.warn{background:var(--warn-soft)}
.chip.bad{background:var(--bad-soft)}
.chip.violet{background:var(--violet-soft)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.btn{border:0;background:var(--bg-2);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 12px;font-size:.86rem}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--bg-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff}
.btn.ai{background:var(--violet-soft)}
.btn:disabled{opacity:.55;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:0;background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted)}
.filters button:hover{background:var(--bg-2);color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.statement{font-size:1rem;color:var(--ink)}
.statement .missing{color:var(--warn);font-weight:600}
.empty{border-radius:var(--radius);padding:34px 22px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1.5px dashed var(--line)}
.empty p{max-width:52ch}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

/* dashboard */
.next{background:linear-gradient(135deg,var(--accent-soft),var(--sky-soft));box-shadow:none}
.next p{max-width:62ch;font-size:1.05rem}
.stage{font-size:.82rem;font-weight:700;color:var(--accent)}
.funnel{display:flex;flex-direction:column;gap:10px}
.f-row{display:grid;grid-template-columns:110px 1fr 36px;gap:12px;align-items:center}
.f-bar{height:10px;background:var(--bg-2);border-radius:999px;overflow:hidden;display:flex}
.f-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;min-width:0}
.f-row b{font-variant-numeric:tabular-nums;font-weight:600}
.goal{display:flex;flex-direction:column;gap:8px}
.goal .f-bar{height:12px}
.big{font-family:var(--display);font-size:2.1rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}

/* ideas */
.idea-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.score-badge{min-width:64px;text-align:center;border-radius:14px;padding:8px 10px;background:var(--accent-soft)}
.score-badge .big{font-size:1.55rem}
.score-badge small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.crit{display:grid;grid-template-columns:minmax(96px,140px) repeat(var(--n,3),minmax(0,100px));gap:6px 14px;font-size:.88rem;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px}
.crit .h{color:var(--muted);font-size:.78rem;font-weight:700}
.pips{display:flex;gap:3px}
.pips i{width:13px;height:7px;border-radius:999px;background:var(--line)}
.pips i.on{background:var(--accent)}
.gap-note{background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}

/* tasks */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;background:var(--bg-2);border-radius:20px;padding:12px}
.col>h3{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;padding:4px 6px 0}
.col .card{padding:16px;gap:8px}
.task.overdue{box-shadow:inset 3px 0 0 var(--bad),var(--shadow)}
@media (max-width:760px){.kanban{grid-template-columns:1fr}}

/* talks / log */
dl.fields{margin:0;display:flex;flex-direction:column;gap:10px}
dl.fields dt{font-weight:700;font-size:.82rem;color:var(--muted)}
dl.fields dd{margin:0;white-space:pre-wrap}
.linked{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px 14px}
.linked .meta{color:var(--ink)}
.timeline{display:flex;flex-direction:column;gap:14px;border-inline-start:2px solid var(--line);padding-inline-start:18px;margin-inline-start:6px}
.timeline .card{position:relative}
.timeline .card::before{content:"";position:absolute;inset-inline-start:-26px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.timeline .card.learning::before{background:var(--warn)}

/* ai output */
.ai-out{background:var(--bg);border-radius:12px;padding:14px 16px;max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ai-out h4{margin:6px 0 0;font-family:var(--display);font-weight:500;font-size:1rem}
.ai-out ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
.ai-note{font-size:.84rem;color:var(--muted)}
.ai-text h4{margin:6px 0 0;font-family:var(--display);font-weight:500;font-size:1rem}
.ai-text ul{margin:0;padding-inline-start:20px}
.ai-text{display:flex;flex-direction:column;gap:6px}
details.ai-box summary{cursor:pointer;font-weight:600;color:var(--accent)}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(25,30,32,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:22px;width:min(640px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lift)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon{border:0;background:var(--bg-2);border-radius:999px;width:32px;height:32px;font-size:.95rem;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.intro{color:var(--muted);font-size:.93rem}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-weight:600;font-size:.92rem}
.field .hint{color:var(--muted);font-size:.82rem}
.field input,.field select,.field textarea{border:1.5px solid transparent;border-radius:12px;padding:10px 12px;background:var(--bg);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:84px;resize:vertical}
.scale{display:flex;gap:6px}
.scale button{width:42px;height:38px;border:0;border-radius:12px;background:var(--bg);cursor:pointer;font-weight:700}
.scale button:hover{background:var(--bg-2)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.task-rows{display:flex;flex-direction:column;gap:8px}
.task-row{display:grid;grid-template-columns:1fr 110px 150px 32px;gap:6px;align-items:center}
.task-row input,.task-row select{border:1.5px solid transparent;border-radius:10px;padding:8px 10px;background:var(--bg);width:100%}
.task-row input:focus,.task-row select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
@media (max-width:560px){.task-row{grid-template-columns:1fr 1fr 32px}.task-row input[type=text]{grid-column:1/-1}}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.form-err{color:var(--bad);font-weight:600}
.form-err:empty{display:none}
.who-pick{display:flex;gap:12px;flex-wrap:wrap}
.who-pick button{flex:1;min-width:120px;padding:20px;font-size:1.2rem;border-radius:18px}
@media (prefers-reduced-motion: no-preference){
  .btn,.filters button,nav.tabs a,.card{transition:background .18s,box-shadow .18s,color .18s}
  .sheet{animation:rise .22s ease-out}
  @keyframes rise{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="תפריט">
    <div class="brand"><span class="mark" aria-hidden="true">ח</span><div><b>חדר המייסדים</b><span class="sub">Jose · Matan · Yonatan</span></div></div>
    <nav class="side-nav" id="tabs" aria-label="מסכים"></nav>
    <div class="side-foot">
      <button class="side-btn" data-act="me" type="button"></button>
      <button class="side-btn" data-act="out" type="button"></button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true">ח</span><b id="top-title">חדר המייסדים</b></div>
      <div class="top-actions"><button class="round-btn" data-act="me" type="button" aria-label="החלפת משתמש"></button><button class="round-btn" data-act="out" type="button" aria-label="יציאה"></button></div>
    </header>
    <main id="view"></main>
  </div>
  <nav class="bottom-nav" id="btabs" aria-label="מסכים"></nav>
  <button class="fab" id="fab" type="button" aria-label="הוספה"></button>
</div>
<div id="modal" hidden></div>

<script type="module">

const firebaseConfig = {

  authDomain: "founders-room-817fe.firebaseapp.com",

  storageBucket: "founders-room-817fe.firebasestorage.app",
  messagingSenderId: "873068750386",
  appId: "1:873068750386:web:10c4c38218e5bb67ff3e2b"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fdb;
try { fdb = initializeFirestore(fbApp, { localCache: persistentLocalCache() }); } catch (e) { fdb = initializeFirestore(fbApp, {}); }

const PEOPLE = ["Jose", "Matan", "Yonatan"];
const OWNERS = { Jose: "Jose", Matan: "Matan", Yonatan: "Yonatan", both: "כולנו" };
const SOURCES = { pain: "כאב אישי", edge: "יתרון לא הוגן", now: "למה עכשיו", spend: "איפה משלמים הרבה", copy: "מודל שעבד במקום אחר", other: "אחר" };
const STATUS = { inbox: "בתיבה", short: "רשימה קצרה", top: "3 המובילות", dropped: "נפסלה" };
const CRITERIA = [
  ["pain", "עוצמת הכאב", "1 = מטרד קטן, 5 = כואב מאוד, מחפשים פתרון עכשיו"],
  ["freq", "תדירות", "1 = פעם בשנה, 5 = כל יום"],
  ["pay", "נכונות לשלם", "1 = לא ישלמו, 5 = כבר משלמים על פתרון גרוע"],

/* ---------- helpers ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDate(s) { if (!s) return ""; const p = String(s).slice(0, 10).split("-"); if (p.length < 3) return esc(s); return `${+p[2]}.${+p[1]}.${p[0].slice(2)}`; }
function fmtTs(ts) { if (!ts) return ""; const d = new Date(ts); return `${d.getDate()}.${d.getMonth() + 1}.${String(d.getFullYear()).slice(2)}`; }
function daysSince(iso) { if (!iso) return null; const d = new Date(iso + "T12:00:00"); return Math.floor((Date.now() - d.getTime()) / 86400000); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function byNewest(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }
function problemsActive() { return state.data.problems.filter(p => !p.example); }
function problemById(id) { return state.data.problems.find(p => p.id === id); }
function problemTitle(id) { const p = problemById(id); return p ? p.title : ""; }
function stClass(st) { return { inbox: "sky", short: "warn", top: "accent", dropped: "bad" }[st] || ""; }
function opts(map, sel) { return Object.entries(map).map(([k, v]) => `<option value="${esc(k)}"${k === sel ? " selected" : ""}>${esc(v)}</option>`).join(""); }

function scoreOf(pid, person) { return state.data.scores.find(s => s.problemId === pid && s.person === person); }
function totalOf(s) {
  if (!s) return null;
  const v = CRITERIA.map(([k]) => +s[k] || 0).filter(x => x > 0);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function rankOf(p) {
  const t = PEOPLE.map(n => totalOf(scoreOf(p.id, n))).filter(x => x != null);
  return t.length ? t.reduce((a, b) => a + b, 0) / t.length : null;
}
function gapsOf(pid) {
  const sc = PEOPLE.map(n => [n, scoreOf(pid, n)]).filter(([, s]) => s);
  if (sc.length < 2) return [];
  return CRITERIA.filter(([k]) => { const v = sc.map(([, s]) => +s[k] || 0); return Math.max(...v) - Math.min(...v) >= 2; })
    .map(([k, l]) => `${l} (${sc.map(([n, s]) => `${n}: ${s[k]}`).join(", ")})`);
}

/* ---------- storage ---------- */
let localSeq = 0;
async function saveDoc(col, id, obj) {
  if (state.mode === "live") {
    const ref = id ? doc(fdb, col, id) : doc(collection(fdb, col));
    await setDoc(ref, obj);
    return ref.id;
  } else {
    const arr = state.data[col];
    if (id) {
      const i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr[i] = { id, ...obj }; else arr.push({ id, ...obj });
    } else { id = "local" + (++localSeq); arr.push({ id, ...obj }); }
    render();
    return id;
  }
}
async function removeDoc(col, id) {
  if (state.mode === "live") await deleteDoc(doc(fdb, col, id));
  else { state.data[col] = state.data[col].filter(x => x.id !== id); render(); }
}
function errText(e) {
  const code = e && e.code;
  if (code === "permission-denied" || code === "invalid_argument") return "אין הרשאה לשמור. נסו להתנתק ולהתחבר מחדש.";
  if (code === "resource-exhausted" || code === "quota_exceeded") return "המקום במאגר התמלא. מחקו פריטים ישנים ונסו שוב.";
  if (code === "resource_exhausted") return "יותר מדי פעולות ברצף. חכו רגע ונסו שוב.";
  return "השמירה לא הצליחה. בדקו את החיבור ונסו שוב.";
}

function md(text) {
  const out = []; let ul = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trim();
    const li = line.match(/^[-*•]\s+(.*)/);
    if (li) { if (!ul) { out.push("<ul>"); ul = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }

    if (!line) continue;
    const h = line.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<h4>${inline(h[1])}</h4>` : `<p>${inline(line)}</p>`);
  }
  if (ul) out.push("</ul>");
  return out.join("");
}

let aiCtl = null;
async function openAI(pid) {
  const p = problemById(pid); if (!p || !state.ai) return;
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="sheet-head"><h2 id="m-title">ניתוח AI: ${esc(p.title)}</h2><button class="icon" type="button" data-close aria-label="סגירה">✕</button></div>
    <p class="ai-note">Claude מנתח לפי הידע שלו, בלי חיפוש באינטרנט, ולכן המידע עלול להיות חלקי או לא עדכני. השתמשו בו כנקודת פתיחה למחקר שלכם, לא כתשובה. הניתוח נספר במכסת השימוש של מי שלוחץ.</p>
    <div class="ai-out" id="ai-out" aria-live="polite"><p class="muted">חושב… זה יכול לקחת עד דקה.</p></div>
    <div class="form-err" id="ai-err"></div>
    <div class="form-actions"><button type="button" class="btn" id="ai-stop">עצירה</button><button type="button" class="btn primary" id="ai-save" hidden>שמירה במחקר</button><button type="button" class="btn ghost" data-close>סגירה</button></div></div>`;
  m.hidden = false;
  const out = document.getElementById("ai-out"), stop = document.getElementById("ai-stop"), save = document.getElementById("ai-save"), err = document.getElementById("ai-err");
  aiCtl = new AbortController();
  const ctl = aiCtl;
  stop.onclick = () => ctl.abort();
  try {
    const { text, truncated } = await state.ai(aiPrompt(p), { signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(text); } });
    if (!document.getElementById("ai-out")) return;
    out.innerHTML = md(text);
    if (truncated) err.textContent = "הניתוח נקטע באמצע. אפשר לשמור את מה שיש.";
    stop.hidden = true; save.hidden = false;
    save.onclick = async () => {
      save.disabled = true;
      try {
        await saveDoc("research", null, { problemId: p.id, kind: "ai", title: "ניתוח AI · " + fmtDate(todayISO()), url: "", note: text, createdBy: state.me, createdAt: Date.now() });
        closeModal();
      } catch (e) { err.textContent = errText(e); save.disabled = false; }
    };
  } catch (e) {
    if (!document.getElementById("ai-out")) return;
    stop.hidden = true;
    if (e && e.text) out.innerHTML = md(e.text);
    const code = e && e.code;
    if (code === "cancelled") { err.textContent = ""; if (!e.text) out.innerHTML = `<p class="muted">הניתוח נעצר.</p>`; }
    else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { err.textContent = "ניתוח AI לא זמין בחשבון הזה."; state.ai = null; render(); }
    else if (code === "rate_limited") err.textContent = "הגעתם למגבלת השימוש כרגע. נסו שוב מאוחר יותר.";
    else if (code === "session_expired") err.textContent = "צריך להתחבר מחדש ל-Claude.";
    else if (code === "refused") { out.innerHTML = ""; err.textContent = "Claude לא השלים את הניתוח הזה. נסו לנסח את הבעיה אחרת."; }
    else err.textContent = "הניתוח נקטע בגלל תקלה. אפשר לסגור ולנסות שוב.";
  }
}

  const fmap = { all: "הכל" }; shortlist.forEach(p => fmap[p.id] = p.title);
  if (f !== "all" && !fmap[f]) fmap[f] = problemTitle(f);
  const checklist = ["competitor", "review", "funding", "market"];
  return `
  <div class="view-head"><div><h1>מחקר שולחני</h1><p class="lead">לפני שמדברים עם לקוחות: מי כבר מנסה לפתור את הבעיה, על מה הלקוחות שלהם מתלוננים (G2, Reddit, Capterra), כמה הם גייסו, ומה גודל השוק.</p></div>
    <div class="actions"><button type="button" class="btn primary" data-add="research">פריט מחקר</button></div></div>
  ${Object.keys(fmap).length > 1 ? filterBar("research", fmap) : ""}
  ${targets.length ? `<div class="grid">${targets.map(p => {
    const mine = state.data.research.filter(r => r.problemId === p.id);
    return `<section class="card"><h3>${esc(p.title)}</h3><div class="meta">${checklist.map(k => { const has = mine.some(r => r.kind === k); return `<span class="chip ${has ? "accent" : ""}">${has ? "✓ " : ""}${RESEARCH_KINDS[k]}</span>`; }).join("")}</div><p class="small muted num">${mine.length} פריטים</p>${aiButton(p)}</section>`;
  }).join("")}</div>` : `<p class="muted small">כשתעבירו בעיות לרשימה הקצרה, יופיע כאן מה כבר נבדק לכל אחת.</p>`}
  ${items.length ? `<div class="list">${items.map(r => {
    const u = safeUrl(r.url);
    return `<article class="card"><div class="meta"><span class="chip ${r.kind === "ai" ? "violet" : "accent"}">${esc(RESEARCH_KINDS[r.kind] || "")}</span><span>${esc(problemTitle(r.problemId))}</span><span>${esc(r.createdBy || "")} · ${fmtTs(r.createdAt)}</span></div>
      <h3>${esc(r.title)}</h3>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener" class="small" dir="ltr" style="word-break:break-all">${esc(u)}</a>` : ""}${r.note ? (r.kind === "ai" ? `<details class="ai-box"><summary>הצגת הניתוח</summary><div class="ai-text" style="margin-top:10px">${md(r.note)}</div></details>` : `<p style="white-space:pre-wrap">${esc(r.note)}</p>`) : ""}
      <div class="row-actions">${r.kind === "ai" ? "" : editBtn("research", r.id)}${deleteBtn("research", r.id)}</div></article>`;
  }).join("")}</div>` : `<div class="empty"><p>עוד אין פריטי מחקר${f !== "all" ? " לבעיה הזו" : ""}.</p></div>`}`;
}

function viewTalks() {
  const f = state.filters.talks;
  const list = state.data.talks.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || byNewest(a, b))
    .filter(t => f === "all" || (f === "external" ? t.kind === "advisor" || t.kind === "investor" : t.kind === f));
  return `
  <div class="view-head"><div><h1>שיחות ופגישות</h1><p class="lead">פגישות פנימיות שבועיות, ושיחות עם יועצים, משקיעים ולקוחות פוטנציאליים. תעדו באותו יום, כל עוד הפרטים טריים.</p></div>
    <div class="actions"><button type="button" class="btn primary" data-add="talks" data-preset="weekly">פגישה שבועית</button><button type="button" class="btn" data-add="talks" data-preset="external">שיחה חיצונית</button></div></div>
  ${filterBar("talks", { all: "הכל", weekly: "פגישות שבועיות", external: "יועצים ומשקיעים", customer: "לקוחות" })}
  ${list.length ? `<div class="list">${list.map(t => t.kind === "weekly" ? `
    <article class="card"><div class="meta"><span class="chip accent">פגישה שבועית</span><span class="num">${fmtDate(t.date)}</span><span>תיעד/ה: ${esc(t.createdBy || "")}</span></div>
      <dl class="fields">${[["collected", "מה עשינו"], ["decisions", "מה החלטנו"], ["blockers", "מה תקוע"], ["nextWeek", "לשבוע הבא"]].filter(([k]) => t[k]).map(([k, l]) => `<div><dt>${l}</dt><dd>${esc(t[k])}</dd></div>`).join("")}</dl>
      ${(() => { const lk = state.data.tasks.filter(x => x.meetingId === t.id); return lk.length ? `<div class="linked"><span class="small muted" style="font-weight:700">משימות שיצאו מהפגישה</span>${lk.map(x => `<div class="meta"><span class="chip ${x.status === "done" ? "accent" : x.status === "doing" ? "sky" : ""}">${TASK_STATUS[x.status] || ""}</span><span>${esc(x.title)}</span><span class="muted">${esc(OWNERS[x.owner] || "")}${x.due ? " · " + fmtDate(x.due) : ""}</span></div>`).join("")}</div>` : ""; })()}
      <div class="row-actions">${editBtn("talks", t.id)}${deleteBtn("talks", t.id)}</div></article>` : `
    <article class="card"><div class="meta"><span class="chip ${t.kind === "customer" ? "warn" : ""}">${esc(TALK_KINDS[t.kind] || "")}</span><span class="num">${fmtDate(t.date)}</span>${t.problemId ? `<span>${esc(problemTitle(t.problemId))}</span>` : ""}<span>תיעד/ה: ${esc(t.createdBy || "")}</span></div>
      <h3>${esc(t.withWhom)}${t.role ? ` <span class="muted small">· ${esc(t.role)}</span>` : ""}</h3>
      <dl class="fields">${[["summary", "על מה דיברנו"], ["insights", "מה למדנו"], ["nextSteps", "צעדים הבאים"]].filter(([k]) => t[k]).map(([k, l]) => `<div><dt>${l}</dt><dd>${esc(t[k])}</dd></div>`).join("")}</dl>
      <div class="row-actions">${editBtn("talks", t.id)}${deleteBtn("talks", t.id)}</div></article>`).join("")}</div>`
    : `<div class="empty"><p>עוד אין כאן תיעוד. פגישה שבועית של שעה, באותו זמן כל שבוע, היא ההרגל הכי חשוב בשלב הזה.</p></div>`}`;
}

function viewTasks() {
  const f = state.filters.tasks;
  const list = state.data.tasks.filter(t => f === "all" || t.owner === f || t.owner === "both");
  const today = todayISO();
  const col = s => list.filter(t => (t.status || "todo") === s).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  const fm = { all: "הכל" }; PEOPLE.forEach(p => fm[p] = p);
  return `
  <div class="view-head"><div><h1>משימות</h1><p class="lead">מי עושה מה, ועד מתי. כל משימה מהפגישה השבועית מקבלת כאן אחראי ותאריך.</p></div>
    <div class="actions"><button type="button" class="btn primary" data-add="tasks">משימה חדשה</button></div></div>
  ${filterBar("tasks", fm)}
  <div class="kanban">${Object.entries(TASK_STATUS).map(([s, l]) => { const items = col(s); return `<section class="col"><h3><span>${l}</span><span class="num">${items.length}</span></h3>
    ${items.length ? items.map(t => { const over = t.due && t.due < today && s !== "done"; return `<article class="card task${over ? " overdue" : ""}">
      <div class="meta"><span class="chip">${esc(OWNERS[t.owner] || t.owner || "")}</span>${t.meetingId ? `<span class="chip sky">מהפגישה ${fmtDate(t.meetingDate)}</span>` : ""}${t.due ? `<span class="num${over ? "" : ""}" ${over ? 'style="color:var(--bad);font-weight:700"' : ""}>${over ? "באיחור · " : ""}${fmtDate(t.due)}</span>` : ""}</div>
      <h3 style="${s === "done" ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(t.title)}</h3>${t.notes ? `<p class="small muted" style="white-space:pre-wrap">${esc(t.notes)}</p>` : ""}
      <div class="row-actions">${Object.keys(TASK_STATUS).filter(k => k !== s).map(k => `<button type="button" class="btn small" data-tstatus="${esc(t.id)}" data-v="${k}">→ ${TASK_STATUS[k]}</button>`).join("")}${editBtn("tasks", t.id)}${deleteBtn("tasks", t.id)}</div></article>`; }).join("") : `<p class="muted small">אין.</p>`}</section>`; }).join("")}</div>`;
}

function viewLog() {
  const list = state.data.log.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || byNewest(a, b));
  return `
  <div class="view-head"><div><h1>יומן החלטות ולמידה</h1><p class="lead">כל החלטה משמעותית וכל לקח, עם הסיבה. כשתגיעו להסכם מייסדים ולגיוס, זה יהיה הזיכרון המשותף שלכם.</p></div>
    <div class="actions"><button type="button" class="btn primary" data-add="log">רשומה חדשה</button></div></div>
  ${list.length ? `<div class="timeline">${list.map(l => `<article class="card ${l.kind === "learning" ? "learning" : ""}">
    <div class="meta"><span class="chip ${l.kind === "learning" ? "warn" : "accent"}">${LOG_KINDS[l.kind] || ""}</span><span class="num">${fmtDate(l.date)}</span>${l.problemId ? `<span>${esc(problemTitle(l.problemId))}</span>` : ""}<span>${esc(l.createdBy || "")}</span></div>
    <h3>${esc(l.title)}</h3>${l.why ? `<p style="white-space:pre-wrap">${esc(l.why)}</p>` : ""}
    <div class="row-actions">${editBtn("log", l.id)}${deleteBtn("log", l.id)}</div></article>`).join("")}</div>`
    : `<div class="empty"><p>היומן ריק. החלטה ראשונה טובה: מתי נפגשים כל שבוע.</p></div>`}`;
}

const RENDER = { home: viewHome, problems: viewProblems, ideas: viewIdeas, research: viewResearch, talks: viewTalks, tasks: viewTasks, log: viewLog };

function viewLogin() {
  return `<section class="card" style="max-width:420px;margin:40px auto;gap:16px">
    <h1>כניסה לחדר המייסדים</h1>
    <p class="muted">הכניסה משותפת ל-Jose, Matan ו-Yonatan. אחרי הכניסה תבחרו מי אתם.</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="l-email">מייל</label><input id="l-email" type="email" autocomplete="username" dir="ltr" required></div>
      <div class="field"><label for="l-pass">סיסמה</label><input id="l-pass" type="password" autocomplete="current-password" dir="ltr" required></div>
      <div class="form-err" id="l-err">${esc(state.loginErr)}</div>
      <div class="form-actions"><button type="submit" class="btn primary">כניסה</button></div>
    </form></section>`;
}
function render() {
  const appEl = document.getElementById("app");
  if (!state.user) {
    appEl.classList.add("signed-out");
    document.getElementById("view").innerHTML = state.user === undefined ? `<p class="muted" style="padding:40px;text-align:center">טוען…</p>` : viewLogin();
    return;
  }
  appEl.classList.remove("signed-out");
  const counts = { problems: problemsActive().length, tasks: state.data.tasks.filter(t => t.status !== "done").length };
  const cur = k => state.view === k ? ' aria-current="page"' : "";
  document.getElementById("tabs").innerHTML = Object.entries(VIEWS).map(([k, v]) =>
    `<a href="#${k}"${cur(k)}>${icon(k)}<span>${v.label}</span>${counts[k] ? `<span class="n">${counts[k]}</span>` : ""}</a>`).join("");
  document.getElementById("btabs").innerHTML = Object.entries(VIEWS).map(([k, v]) =>
    `<a href="#${k}"${cur(k)}>${icon(k)}<span>${v.short}</span>${counts[k] && k === "tasks" ? `<i class="dot" aria-hidden="true"></i>` : ""}</a>`).join("");
  document.querySelectorAll('.side-btn[data-act="me"]').forEach(b => b.innerHTML = `${icon("user")}<span>${state.me ? esc(state.me) + " · החלפה" : "מי אני?"}</span>`);
  document.querySelectorAll('.side-btn[data-act="out"]').forEach(b => b.innerHTML = `${icon("out")}<span>יציאה</span>`);
  document.querySelectorAll('.round-btn[data-act="me"]').forEach(b => b.innerHTML = state.me ? `<span class="avatar">${esc(state.me[0])}</span>` : icon("user"));
  document.querySelectorAll('.round-btn[data-act="out"]').forEach(b => b.innerHTML = icon("out"));
  document.getElementById("fab").innerHTML = icon("plus");
  let banner = "";
  if (state.mode === "loading" && state.slow) banner = `<div class="banner">הנתונים עדיין לא נטענו. ייתכן שיש בעיית חיבור.</div>`;
  else if (state.slow) banner = `<div class="banner">ייתכן שהנתונים לא מעודכנים. בודקים חיבור…</div>`;
  if (state.readOnly) banner += `<div class="banner">השמירה נחסמה. נסו להתנתק ולהתחבר מחדש.</div>`;
  const body = state.mode === "loading" && !state.loaded.size ? `<p class="muted">טוען…</p>` : RENDER[state.view]();
  document.getElementById("view").innerHTML = banner + body;
}

/* ---------- events ---------- */
const armed = new Map();
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button,[data-close]");
  if (!t) return;
  if (t.hasAttribute("data-close")) { if (aiCtl) aiCtl.abort(); closeModal(); return; }
  if (t.hasAttribute("data-delrow")) { const rows = t.closest(".task-rows"); if (rows.children.length > 1) t.closest(".task-row").remove(); else t.closest(".task-row").querySelectorAll("input").forEach(i => i.value = ""); return; }
  if (t.dataset.act === "me") { pickMe(); return; }
  if (t.dataset.act === "out") { await signOut(auth); return; }
  if (t.id === "fab") { const [c, p] = FAB_ACTION[state.view] || ["problems"]; addOrEdit(c, null, p); return; }
  const d = t.dataset;
  try {
    if (d.me) { state.me = d.me; lsSet("founders-me", d.me); closeModal(); render(); return; }
    if (d.scale) { const inp = document.getElementById(d.scale); inp.value = d.v; t.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t))); return; }
    if (d.addrow) { document.getElementById(d.addrow).insertAdjacentHTML("beforeend", taskRowHTML()); document.getElementById(d.addrow).lastElementChild.querySelector("input").focus(); return; }
    if (d.ai) { openAI(d.ai); return; }
    if (d.filter) { state.filters[d.filter] = d.v; render(); return; }
    if (d.add) { addOrEdit(d.add, null, d.preset); return; }
    if (d.edit) { addOrEdit(d.edit, d.id); return; }
    if (d.score) { openScore(d.score); return; }
    if (d.status) {
      const p = problemById(d.status); if (!p) return;
      const doc = { ...p, status: d.v, updatedAt: Date.now() }; delete doc.id;
      await saveDoc("problems", p.id, doc); return;
    }
    if (d.tstatus) {
      const x = state.data.tasks.find(k => k.id === d.tstatus); if (!x) return;
      const doc = { ...x, status: d.v, updatedAt: Date.now() }; delete doc.id;
      await saveDoc("tasks", x.id, doc); return;
    }
    if (d.del) {
      const key = d.del + "/" + d.id;
      if (!armed.has(key)) {
        t.classList.add("armed"); t.textContent = "ללחוץ שוב למחיקה";
        armed.set(key, setTimeout(() => { armed.delete(key); t.classList.remove("armed"); t.textContent = "מחיקה"; }, 3500));
        return;
      }
      clearTimeout(armed.get(key)); armed.delete(key);
      await removeDoc(d.del, d.id);
      if (d.del === "problems") for (const n of PEOPLE) { if (scoreOf(d.id, n)) await removeDoc("scores", d.id + "__" + n); }
      return;
    }
  } catch (err) {
    if (err && (err.code === "permission-denied" || err.code === "invalid_argument")) { state.readOnly = true; render(); }
    else { const v = document.getElementById("view"); v.insertAdjacentHTML("afterbegin", `<div class="banner">${esc(errText(err))}</div>`); }
  }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const email = document.getElementById("l-email").value.trim(), pass = document.getElementById("l-pass").value;
  const errEl = document.getElementById("l-err"), btn = e.target.querySelector("button[type=submit]");
  if (!email || !pass) { errEl.textContent = "צריך מייל וסיסמה."; return; }
  btn.disabled = true; errEl.textContent = "";
  try { await setPersistence(auth, browserLocalPersistence); await signInWithEmailAndPassword(auth, email, pass); }
  catch (err) {
    const c = err && err.code;
    errEl.textContent = c === "auth/too-many-requests" ? "יותר מדי ניסיונות. חכו כמה דקות ונסו שוב." : c === "auth/network-request-failed" ? "אין חיבור לאינטרנט." : "המייל או הסיסמה שגויים.";
    btn.disabled = false;
  }
});
document.addEventListener("submit", (e) => { if (e.target.id === "m-form") { e.preventDefault(); if (currentSubmit) currentSubmit(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.getElementById("modal").hidden && state.me) { if (aiCtl) aiCtl.abort(); closeModal(); } });

function route() { const h = location.hash.slice(1); state.view = RENDER[h] ? h : "home"; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
state.me = PEOPLE.includes(lsGet("founders-me")) ? lsGet("founders-me") : null;
state.view = RENDER[location.hash.slice(1)] ? location.hash.slice(1) : "home";
render();

const SEED = {
  "problems/example1": {"cluster":"הרשאות ואבטחה","cost":"כמה שעות בחודש, וסיכון אבטחה כשהרשאות נשארות פתוחות","createdAt":1794772600000,"createdBy":"Claude","example":true,"notes":"זו דוגמה לפורמט. אפשר למחוק אותה אחרי שמוסיפים בעיות אמיתיות.","source":"edge","status":"inbox","title":"מעקב אחרי הרשאות בענן","what":"לדעת מי קיבל גישה לאילו מערכות","when":"כשעובד עוזב או מחליף תפקיד","who":"מנהלי IT בחברות של 50–200 עובדים","workaround":"אקסל שמתעדכן ידנית ובדיקה פעם ברבעון"},
  "tasks/t1": {"createdAt":1794772600000,"createdBy":"Claude","due":"2026-11-29","notes":"מכל 5 המקורות. בלי פתרונות.","owner":"Jose","status":"todo","title":"לאסוף 15 בעיות לתיבה"},
  "tasks/t2": {"createdAt":1794772600001,"createdBy":"Claude","due":"2026-11-29","notes":"להתחיל ממה שלקוחות בחברת הסייבר התלוננו עליו, ממה שנעשה ידנית, ועל מה שילמו יותר מדי.","owner":"Matan","status":"todo","title":"לאסוף 15 בעיות לתיבה"},
  "tasks/t3": {"createdAt":1794772600002,"createdBy":"Claude","due":"2026-11-18","notes":"שעה אחת בשבוע. לתעד את ההחלטה ביומן.","owner":"both","status":"todo","title":"לקבוע יום ושעה קבועים לפגישה שבועית"}
};
async function seedOnce() {
  try {
    const meta = doc(fdb, "meta", "seed");
    const snap = await getDoc(meta);
    if (snap.exists()) return;
    const batch = writeBatch(fdb);
    for (const [path, data] of Object.entries(SEED)) { const [c, id] = path.split("/"); batch.set(doc(fdb, c, id), data); }
    batch.set(meta, { at: Date.now() });
    await batch.commit();
  } catch (e) { console.warn("seed skipped", e && e.code); }
}

let unsubs = [];
function stopListening() { unsubs.forEach(u => u()); unsubs = []; COLS.forEach(c => state.data[c] = []); state.loaded = new Set(); }
function startListening() {
  state.mode = "live";
  let timer = setTimeout(() => { state.slow = true; render(); }, 10000);
  const confirmed = new Set();
  COLS.forEach(c => {
    unsubs.push(onSnapshot(collection(fdb, c), { includeMetadataChanges: true }, snap => {
      state.data[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.loaded.add(c);
      if (!snap.metadata.fromCache) confirmed.add(c);
      if (confirmed.size === COLS.length && timer) { clearTimeout(timer); timer = null; state.slow = false; }
      render();
    }, err => {
      state.loaded.add(c);
      if (timer) { clearTimeout(timer); timer = null; }
      if (err && err.code === "permission-denied") state.readOnly = true;
      state.slow = true; render();
    }));
  });
}
onAuthStateChanged(auth, async (u) => {
  stopListening();
  state.user = u || null;
  state.loginErr = "";
  render();
  if (u) {
    startListening();
    seedOnce();
    if (!state.me) pickMe();
  }
});
</script>
